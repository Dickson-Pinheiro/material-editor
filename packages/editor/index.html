<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>diagramador</title>
    <meta
      name="description"
      content="Editor de diagramação que roda inteiro no navegador: o motor vai junto como WebAssembly e o PDF sai da própria página."
    />
    <!-- The brand mark, inline: one less request, and no 404 on a fresh deploy. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l6 7-6 7-6-7z' fill='%230d99ff'/%3E%3Cpath d='M8 4.6L10.9 8 8 11.4 5.1 8z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-left">
        <span class="brand" title="diagramador">◈</span>
        <div class="tools" id="tools"></div>
      </div>

      <div class="toolbar-center">
        <input
          id="doc-title"
          class="doc-title"
          aria-label="Nome do documento"
          spellcheck="false"
        />
      </div>

      <div class="toolbar-right">
        <div class="zoom-control">
          <button id="zoom-out" class="icon-button" title="Diminuir (Ctrl+−)">−</button>
          <button id="zoom-label" class="zoom-label" title="Ajustar à janela (Shift+1)">
            100%
          </button>
          <button id="zoom-in" class="icon-button" title="Aumentar (Ctrl++)">+</button>
        </div>
        <div class="actions" id="actions"></div>
      </div>
    </header>

    <main class="workspace">
      <aside id="layers" class="sidebar left" aria-label="Páginas e camadas"></aside>

      <section class="canvas-holder">
        <canvas id="canvas" tabindex="0"></canvas>
        <div id="status" class="status" role="status"></div>
        <div id="hint" class="hint"></div>
      </section>

      <aside id="inspector" class="sidebar right" aria-label="Propriedades"></aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
